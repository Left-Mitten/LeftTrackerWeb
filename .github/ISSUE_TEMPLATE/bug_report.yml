name: Bug report
description: Report a problem with the site or its daily data build.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, compare data issues with the [source Google Sheet](https://docs.google.com/spreadsheets/d/1gPBdBrqVCbtuy7f1bjOdCDUzEv5RqbbU1yYAr3KoHYE).

  - type: dropdown
    id: area
    attributes:
      label: What is affected?
      options:
        - Website display or navigation
        - Lawmaker or bill data
        - Daily build or deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page URL and the person or bill if the issue concerns a specific record.
      placeholder: Describe what you saw and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Search or select…
        3. Observe…
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Browser and device
      description: Include browser/version and device or operating system if relevant.
      placeholder: e.g. Firefox on Android
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or links are helpful. Do not include private or sensitive information.
    validations:
      required: false
