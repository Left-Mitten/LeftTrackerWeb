name: Feature request
description: Suggest an improvement to browsing lawmakers, bills, or voting records.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the question or task you cannot easily complete with the current site.
      placeholder: I want to…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: Describe the site behavior or information that would improve this.
      placeholder: It would help if…
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant pages or data
      description: Link a person, bill, source-sheet entry, or share a mock-up if useful.
    validations:
      required: false
