name: Build and publish website

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install -r requirements.txt

      - name: Download spreadsheet and build site data
        env:
          GOOGLE_SHEETS_ID: 1gPBdBrqVCbtuy7f1bjOdCDUzEv5RqbbU1yYAr3KoHYE
        run: |
          curl --fail --location --retry 3 \
            "https://docs.google.com/spreadsheets/d/${GOOGLE_SHEETS_ID}/export?format=xlsx" \
            --output /tmp/tracker.xlsx
          python scripts/build_data.py /tmp/tracker.xlsx pages/data.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
