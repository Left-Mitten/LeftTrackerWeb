# Tailor repository settings for the Congressional Democrat Left Tracker website.
license: BlueOak-1.0.0

languages:
  go: false
  rust: false
  python: true

repository:
  description: Search congressional bill sponsorship and voting records by lawmaker and bill.
  has_wiki: false
  has_discussions: false
  has_projects: false
  has_issues: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  delete_branch_on_merge: true
  allow_update_branch: true
  allow_auto_merge: true
  web_commit_signoff_required: false
  private_vulnerability_reporting_enabled: true
  vulnerability_alerts_enabled: true
  automated_security_fixes_enabled: true
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false
  secret_scanning: enabled
  secret_scanning_push_protection: enabled
  secret_scanning_non_provider_patterns: enabled

immutable_releases:
  enabled: false

actions:
  # Options: all, local_only, selected. SHA pinning applies separately.
  # selected requires github_owned_allowed, verified_allowed, and patterns_allowed.
  enabled: true
  allowed_actions: all
  sha_pinning_required: false
  fork_pr_contributor_approval:
    approval_policy: first_time_contributors

code_scanning:
  state: configured
  query_suite: default
  threat_model: remote
  # An empty list means GitHub detects the languages. Valid values:
  # actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift
  languages: []

code_quality:
  state: not-configured
  # An empty list means GitHub detects the languages. Valid values:
  # csharp, go, java-kotlin, javascript-typescript, python, ruby
  languages: []

ruleset:
  # Tailor manages one ruleset named "Tailor" and owns it entirely.
  # active enforces the rules. disabled keeps the ruleset on GitHub but
  # GitHub ignores it, so a hand-made ruleset can govern instead.
  enforcement: active
  bypass_actors:
    # actor_type: RepositoryRole, Team, User, Integration, DeployKey
    # RepositoryRole actor_id: 2 maintain, 4 write, 5 admin
    # bypass_mode: always, pull_request, exempt
    - actor_id: 5
      actor_type: RepositoryRole
      bypass_mode: always
  conditions:
    ref_name:
      # Branch names or fnmatch patterns in refs/heads/<name> form.
      # include also accepts ~DEFAULT_BRANCH and ~ALL.
      include:
        - ~DEFAULT_BRANCH
      exclude: []
  rules:
    creation: false
    update: false
    deletion: true
    required_linear_history: false
    required_signatures: false
    non_fast_forward: true
    pull_request:
      enabled: true
      parameters:
        required_approving_review_count: 1
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: false
        require_last_push_approval: false
        required_review_thread_resolution: true
        require_extra_approval_for_unattributed_changes: true
        # Any combination of merge, squash, rebase. At least one.
        allowed_merge_methods:
          - squash
          - rebase
    required_status_checks:
      enabled: false
      parameters:
        # Require branches to be up to date before merging.
        strict_required_status_checks_policy: false
        # Do not require status checks on creation.
        do_not_enforce_on_create: false
        # context is the check name as shown on a pull request. For a GitHub
        # Actions job that is the job's name. integration_id is optional and
        # restricts the check to one app; 15368 is GitHub Actions.
        required_status_checks: []
    code_scanning:
      enabled: false
      parameters:
        # tool is the tool name as GitHub shows it, for example CodeQL.
        # alerts_threshold: none, errors, errors_and_warnings, all
        # security_alerts_threshold: none, critical, high_or_higher, medium_or_higher, all
        code_scanning_tools:
          - tool: CodeQL
            alerts_threshold: errors
            security_alerts_threshold: high_or_higher

# Pages is opt-in. Omission or enabled: false leaves Pages unmanaged.
# generator: static (default) creates a starter in an empty path. Hugo and Jekyll need an existing site.
# path: project-relative source directory, default pages.
# branch: omit to use the current repository default branch.
# cname: omit to preserve the domain, use "" to clear it, or set a domain.
pages:
  enabled: true
  generator: static
  path: pages
  links: {}

labels:
  - name: bug
    color: d20f39
    description: A problem with the site, data display, or publishing workflow.

  - name: documentation
    color: 04a5e5
    description: Improve project or site documentation.

  - name: enhancement
    color: 1e66f5
    description: Improve how visitors browse lawmakers, bills, or voting records.

  - name: question
    color: 7287fd
    description: A question about the site or its data.

  - name: dependencies
    color: fe640b
    description: Update a GitHub Actions or Python dependency.

  - name: data issue
    color: "b5e3d8"
    description: A possible discrepancy in the source spreadsheet or generated records.

swatches:
  - path: README.md
    alteration: always

  - path: CONTRIBUTING.md
    alteration: always

  - path: SECURITY.md
    alteration: always

  - path: SUPPORT.md
    alteration: always

  - path: .github/dependabot.yml
    alteration: first-fit

  - path: .github/FUNDING.yml
    alteration: first-fit

  - path: .github/ISSUE_TEMPLATE/bug_report.yml
    alteration: always

  - path: .github/ISSUE_TEMPLATE/feature_request.yml
    alteration: always

  - path: .github/ISSUE_TEMPLATE/config.yml
    alteration: first-fit

  - path: CODE_OF_CONDUCT.md
    alteration: always

  - path: .gitignore
    alteration: first-fit

  - path: .github/workflows/publish-pages.yml
    alteration: always

  - path: requirements.txt
    alteration: first-fit

  - path: scripts/build_data.py
    alteration: first-fit

  - path: pages/index.html
    alteration: first-fit

  - path: pages/person.html
    alteration: first-fit

  - path: pages/bill.html
    alteration: first-fit

  - path: pages/style.css
    alteration: first-fit

  - path: pages/app.js
    alteration: first-fit

  - path: .tailor.yml
    alteration: always
